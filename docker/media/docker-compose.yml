# Jellyfin and its ThePornDB matcher (docs/SETUP_docker.md). Included from ../docker-compose.yml;
# variables come from the .env next to this file.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Sofia
    # Intel Quick Sync (i5-1235U iGPU) for hardware transcoding
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
    volumes:
      - /volume1/ServerConfigurations/Jellyfin:/config
      - /volume1/Movies1:/movies1
      - /volume2/Movies2:/movies2
      - /volume3/Movies3:/movies3
      - /volume5/MoviesAdult:/moviesadult
      # Same layout as MoviesAdult (Porn, PornScenes), on the disk of volume 6 once volume 5 filled up
      - /volume6/MoviesAdult1:/moviesadult1
      # One photo per actor, <tmdb-id>.jpg, that our NFOs point to; media-ingest fills it
      - /volume1/MediaMeta/People:/people:ro
      # The collections' folders (title, plot, artwork) where Jellyfin keeps them; who is in one Jellyfin keeps only
      # in its database. media-ingest makes new ones through its API (boxsets.py)
      - /volume1/MediaMeta/Collections:/config/data/data/collections

  # Replaced by media-adult (PLAN_media_services.md, stage 4); stopped, in the "old" profile so make up leaves it out,
  # until the migration of „Порно“ is checked
  jellyfin-tpdb-match:
    profiles: [old]
    build: ./jellyfin-tpdb-match
    container_name: jellyfin-tpdb-match
    restart: unless-stopped
    depends_on:
      - jellyfin
    ports:
      - 8097:8097
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      # Admin API key; the ThePornDB token is read from the plugin's own configuration
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in docker/media/.env}
      LIBRARY: Порно
      # Studios whose ThePornDB variants ("Wicked Pictures", ...) are merged into this one name
      MERGE_STUDIOS: Wicked
      # Last resort when ThePornDB has nothing; empty turns TMDb off
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      # Per-file keywords entered on the status page
      - /volume1/ServerConfigurations/JellyfinTpdbMatch:/data
      # Same path as inside jellyfin, so item paths can be used as is; matched movies get their own folder
      - /volume5/MoviesAdult/Porn:/moviesadult/Porn
      - /volume6/MoviesAdult1/Porn:/moviesadult1/Porn

  # Brings new movies and series into the film and series libraries, and finished qBittorrent downloads into them
  media-ingest:
    build:
      context: .
      dockerfile: media-ingest/Dockerfile
    container_name: media-ingest
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in docker/media/.env}
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in docker/media/.env}
      LIBRARIES: Филми,Филми - детски,Филми - български,Филми - руски,Еротика
      # Release folders (a season in the name, or downloaded through qBittorrent) are organized; the rest are left alone
      SERIES_LIBRARIES: Сериали,Сериали - детски,Сериали - български,Сериали - руски
      # Libraries whose folders from before our NFOs are brought to them (PLAN_media_services.md, stage 3); one at a time
      # media-adult's, read only for the TMDB actors their NFOs name, whose photos are kept with the rest
      ADULT_LIBRARIES: Порно,Порно - сцени
      MIGRATE_LIBRARIES: Филми - руски,Филми - български,Филми,Сериали - български,Филми - детски,Сериали - детски,Сериали,Еротика,Сериали - руски
      # A finished torrent whose category is one of LIBRARIES or SERIES_LIBRARIES is moved into it; the category is kept
      # pointed at whichever of DOWNLOAD_DIRS (qBittorrent's paths) has the most free space
      QBIT_URL: http://host.docker.internal:8888
      DOWNLOAD_DIRS: /downloads,/volume2/Movies2/Downloads,/volume3/Movies3/Downloads
      QBIT_PATHS: /downloads=/volume1/Downloads,/volume2=/volume2,/volume3=/volume3
      VOLUME_PATHS: /movies1=/volume1/Movies1,/movies2=/volume2/Movies2,/movies3=/volume3/Movies3
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /volume1/ServerConfigurations/MediaIngest:/data
      # Same paths as inside jellyfin, so item paths can be used as is; movies are renamed in place
      - /volume1/Movies1:/movies1
      - /volume2/Movies2:/movies2
      - /volume3/Movies3:/movies3
      - /volume5/MoviesAdult/Erotic:/moviesadult/Erotic
      - /volume5/MoviesAdult/Porn:/moviesadult/Porn:ro
      - /volume5/MoviesAdult/PornScenes:/moviesadult/PornScenes:ro
      - /volume6/MoviesAdult1/Porn:/moviesadult1/Porn:ro
      - /volume6/MoviesAdult1/PornScenes:/moviesadult1/PornScenes:ro
      - /volume1/MediaMeta/People:/people
      - /volume1/MediaMeta/Collections:/collections
      # What each user watched, exported nightly (userdata.py)
      - /volume1/MediaMeta/Userdata:/userdata
      # Whole volumes, so a download folder and the library are one mount and a download moves with a rename
      - /volume1:/volume1
      - /volume2:/volume2
      - /volume3:/volume3

  # Checks and fixes the sync of the libraries' subtitles, downloads Bulgarian ones, asks about sound without a language
  media-subtitles:
    build:
      context: .
      dockerfile: media-subtitles/Dockerfile
    container_name: media-subtitles
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in docker/media/.env}
      LIBRARIES: Филми,Филми - детски,Филми - български,Филми - руски,Еротика
      SERIES_LIBRARIES: Сериали,Сериали - детски,Сериали - български,Сериали - руски
    volumes:
      - /volume1/ServerConfigurations/MediaSubtitles:/data
      # Same paths as inside jellyfin, so item paths can be used as is
      - /volume1/Movies1:/movies1
      - /volume2/Movies2:/movies2
      - /volume3/Movies3:/movies3
      - /volume5/MoviesAdult/Erotic:/moviesadult/Erotic

  # The adult libraries, „Порно“ and „Порно - сцени“: NFOs and artwork from ThePornDB (PLAN_media_services.md, stage 4)
  media-adult:
    build:
      context: .
      dockerfile: media-adult/Dockerfile
    container_name: media-adult
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in docker/media/.env}
      TPDB_API_TOKEN: ${TPDB_API_TOKEN:?set TPDB_API_TOKEN in docker/media/.env}
      # Last resort when ThePornDB has nothing
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in docker/media/.env}
      # Finished torrents in the category „Порно“ are matched in qBittorrent's download folder on an adult disk and
      # moved from there into the library on the same disk; the category is kept pointed at the one with the most
      # free space
      QBIT_URL: http://host.docker.internal:8888
      DOWNLOAD_DIRS: /volume5/MoviesAdult/Downloads,/volume6/MoviesAdult1/Downloads
      QBIT_PATHS: /volume5/MoviesAdult=/moviesadult,/volume6/MoviesAdult1=/moviesadult1
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /volume1/ServerConfigurations/MediaAdult:/data
      # The whole adult disks at the same paths as inside jellyfin, so item paths can be used as is and a download
      # moves into the library with a rename
      - /volume5/MoviesAdult:/moviesadult
      - /volume6/MoviesAdult1:/moviesadult1
      # The performers' photos, tpdb-<id>.jpg, next to the actors' that media-ingest keeps
      - /volume1/MediaMeta/People:/people

  # The only address of the status pages of media-ingest (/ingest/), media-subtitles (/subtitles/) and media-adult
  # (/adult/), which publish no port of their own
  # Who may open the status pages: Jellyfin's users sign in, nginx in media-web asks it before every request
  media-auth:
    build:
      context: .
      dockerfile: media-auth/Dockerfile
    container_name: media-auth
    restart: unless-stopped
    depends_on:
      - jellyfin
    environment:
      JELLYFIN_URL: http://jellyfin:8096

  media-web:
    build: ./media-web
    container_name: media-web
    restart: unless-stopped
    depends_on:
      - media-auth
      - media-ingest
      - media-subtitles
      - media-adult
    ports:
      - 8090:8090

  # Was the UGOS App Center app (same image); its config moved to ServerConfigurations. Host network keeps
  # the WebUI on :8888 for Prowlarr. No login from Docker's networks (AuthSubnetWhitelist), for media-ingest.
  # A download folder on every volume with a film library: media-ingest picks the one with the most
  # free space and moves finished downloads into the library on that disk.
  # PGID 10 (admin): UGOS grants the Downloads share to the admin group only, as it does dani_yord83 on the host
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: host
    environment:
      PUID: 1000
      PGID: 10
      TZ: Europe/Sofia
      WEBUI_PORT: 8888
      TORRENTING_PORT: 6888
    volumes:
      - /volume1/ServerConfigurations/qBittorrent:/config
      - /volume1/Downloads:/downloads
      - /volume2/Movies2/Downloads:/volume2/Movies2/Downloads
      - /volume3/Movies3/Downloads:/volume3/Movies3/Downloads
      # The adult disks' download folders, for media-adult
      - /volume5/MoviesAdult/Downloads:/volume5/MoviesAdult/Downloads
      - /volume6/MoviesAdult1/Downloads:/volume6/MoviesAdult1/Downloads

  # Tracker search; a grab goes to qbittorrent (host network, WebUI :8888), configured as a download client
  # in Prowlarr itself: category Филми for Movies, Сериали for TV, none (left alone by the ingest) for the rest
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Sofia
    ports:
      - 9696:9696
    volumes:
      - /volume1/ServerConfigurations/Prowlarr:/config
