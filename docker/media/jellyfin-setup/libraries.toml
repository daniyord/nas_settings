# Jellyfin's libraries as they should be; `make jellyfin-setup` lists what differs on the server, and
# `make jellyfin-setup APPLY=1` makes it so (setup.py). Settings are the names of Jellyfin's LibraryOptions
# (GET /Library/VirtualFolders); one left out of a library is whatever Jellyfin has.
#
# Our NFOs are the source of the metadata (PLAN_media_services.md): Jellyfin writes neither NFOs nor artwork into the
# folders (MetadataSavers = [], SaveLocalMetadata = false), except in the two libraries on ThePornDB until stage 4.
# Every library reads only our NFOs and the images in its folders (stage 3, 2026-11-24), except „Порно“ and „Порно -
# сцени“ on ThePornDB until stage 4.

# How NFOs are written, for the libraries that still have Jellyfin write them (GET /System/Configuration/xbmcmetadata)
[nfo]
ReleaseDateFormat = "yyyy-MM-dd"
SaveImagePathsInNfo = false
EnablePathSubstitution = true
EnableExtraThumbsDuplication = false

# The server's own settings (GET /System/Configuration). Its language also names what Jellyfin names itself, such as a
# season with no title of its own ("Сезон 1", "Специални"), when the item is made
[server]
UICulture = "bg-BG"
PreferredMetadataLanguage = "bg"
MetadataCountryCode = "BG"

# Server-wide fetchers per item type (GET /System/Configuration, MetadataOptions); people's are reached only here.
# People get only the photo our NFOs point to (PEOPLE_DIR of media-ingest), not TMDB's.
[metadata_options.Person]
DisabledMetadataFetchers = ["TheMovieDb"]
DisabledImageFetchers = ["TheMovieDb"]

# Plugins switched off (not uninstalled); a restart of Jellyfin makes it take effect. The bundled ones (TMDb, OMDb,
# ...) can't be: OMDb is simply in no library's fetchers
[plugins]
disabled = []

# Scheduled tasks that would go online on their own (by Key): left without triggers, still there to run by hand
[tasks]
disabled = ["RefreshPeople", "TmdbRefreshUpcomingEpisodes"]

# Which libraries each user sees ("all": every one, as an administrator); users are made by hand
[users]
adult = ["Порно - сцени", "Еротика", "Порно"]
home = ["Collections", "Документални филми", "Филми", "Филми - български", "Филми - детски", "Филми - руски", "Сериали", "Сериали - български", "Сериали - детски", "Сериали - руски"]
root = "all"

# The same in every library
[options]
AllowEmbeddedSubtitles = "AllowAll"
AutomaticRefreshIntervalDays = 0
AutomaticallyAddToCollection = false
CustomTagDelimiters = ["/", "|", ";", "\\"]
DelimiterWhitelist = []
DisabledLocalMetadataReaders = []
DisabledLyricFetchers = []
DisabledMediaSegmentProviders = []
DisabledSubtitleFetchers = []
EnableChapterImageExtraction = false
EnableEmbeddedEpisodeInfos = false
EnableEmbeddedExtrasTitles = false
EnableEmbeddedTitles = false
EnableTrickplayImageExtraction = false
Enabled = true
ExtractChapterImagesDuringLibraryScan = false
ExtractTrickplayImagesDuringLibraryScan = false
LyricFetcherOrder = []
MediaSegmentProviderOrder = []
PreferNonstandardArtistsTag = false
RequirePerfectSubtitleMatch = true
SaveLyricsWithMedia = false
SaveSubtitlesWithMedia = true
SaveTrickplayWithMedia = false
# As our season.nfo titles name it; the others are "Сезон N" there (Jellyfin's Bulgarian leaves them "Season N")
SeasonZeroDisplayName = "Специални"
SkipSubtitlesIfEmbeddedSubtitlesPresent = false
SubtitleFetcherOrder = []
UseCustomTagDelimiters = false

