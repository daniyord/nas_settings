# One address for the status pages of media-ingest and media-subtitles: each under its own path, so the pages' relative
# api/... and common/... reach their own service
server {
    listen 8090;
    # Docker's DNS, asked again per request: a recreated service comes back on another address, which a name in
    # proxy_pass would keep from nginx's start
    resolver 127.0.0.11 valid=10s;
    proxy_read_timeout 300s;

    location = / {
        return 302 /ingest/;
    }

    location = /ingest {
        return 301 /ingest/;
    }

    location = /subtitles {
        return 301 /subtitles/;
    }

    location /ingest/ {
        set $upstream http://media-ingest:8098;
        rewrite ^/ingest(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location /subtitles/ {
        set $upstream http://media-subtitles:8099;
        rewrite ^/subtitles(/.*)$ $1 break;
        proxy_pass $upstream;
    }
}
