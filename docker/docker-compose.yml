name: nas

# One folder per group of services, each with its own compose file and, when it needs secrets, its own .env.
# Tailscale stays here: it is the NAS's own remote access, and recreating it cuts ssh sessions over the tailnet.
include:
  - media/docker-compose.yml
  - books/docker-compose.yml
  - boardgames/docker-compose.yml

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: nas
    restart: unless-stopped
    # Host networking exposes every NAS port (UGOS UI, Jellyfin, Calibre-Web) on the tailnet
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Only needed for the first login; the node key is kept in TS_STATE_DIR afterwards
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: nas
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # Keep UGOS's own DNS settings untouched
      TS_ACCEPT_DNS: "false"
    volumes:
      - /volume1/ServerConfigurations/Tailscale:/var/lib/tailscale
