# One address for the status pages of media-ingest, media-subtitles and media-adult: each under its own path, so the pages' relative
# api/... and common/... reach their own service. media-auth signs in with Jellyfin's users and is asked before
# every request who may see or change what (docs/SETUP_docker.md)
server {
    listen 8090;
    # Docker's DNS, asked again per request: a recreated service comes back on another address, which a name in
    # proxy_pass would keep from nginx's start
    resolver 127.0.0.11 valid=10s;
    proxy_read_timeout 300s;

    error_page 401 = @login;
    error_page 403 /auth/forbidden;

    location = /_check {
        internal;
        set $auth http://media-auth:8110/check;
        proxy_pass $auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location @login {
        # The whole address asked for, query and all; the login page takes everything after "next="
        return 302 /auth/login?next=$request_uri;
    }

    location /auth/ {
        set $upstream http://media-auth:8110;
        rewrite ^/auth(/.*)$ $1 break;
        proxy_pass $upstream;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = / {
        return 302 /auth/home;
    }

    location = /ingest {
        return 301 /ingest/;
    }

    location = /subtitles {
        return 301 /subtitles/;
    }

    location = /adult {
        return 301 /adult/;
    }

    location /ingest/ {
        auth_request /_check;
        set $upstream http://media-ingest:8098;
        rewrite ^/ingest(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location /subtitles/ {
        auth_request /_check;
        set $upstream http://media-subtitles:8099;
        rewrite ^/subtitles(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location /adult/ {
        auth_request /_check;
        set $upstream http://media-adult:8100;
        rewrite ^/adult(/.*)$ $1 break;
        proxy_pass $upstream;
    }
}
