# Services of /shared/projects/boardgames (docs/SETUP_boardgames.md). Included from ../docker-compose.yml;
# variables come from the .env next to this file.
services:
  # Dev database of /shared/projects/boardgames: the app itself runs on the PC (make dev) and connects here
  boardgames-dev-db:
    image: postgres:17-alpine
    container_name: boardgames-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardgames
      POSTGRES_PASSWORD: ${BOARDGAMES_DEV_DB_PASSWORD:?set BOARDGAMES_DEV_DB_PASSWORD in docker/boardgames/.env}
      POSTGRES_DB: boardgames_dev
      TZ: Europe/Sofia
    # Reachable from the LAN and, through the host-networked tailscale container, from the tailnet
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgames -d boardgames_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /volume1/ServerConfigurations/Boardgames/dev/postgres:/var/lib/postgresql/data
      - /volume1/ServerConfigurations/Boardgames/dev/backups:/backups

  # Prod: the whole app on the NAS, deployed with make deploy-prod from the boardgames repo
  boardgames:
    build:
      context: ../../../projects/boardgames
    container_name: boardgames
    restart: unless-stopped
    depends_on:
      boardgames-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://boardgames:${BOARDGAMES_PROD_DB_PASSWORD:?set BOARDGAMES_PROD_DB_PASSWORD in docker/boardgames/.env}@boardgames-db:5432/boardgames_prod
      TZ: Europe/Sofia
    ports:
      - 8110:8000

  # No published port: only the prod app reaches it (psql via docker exec)
  boardgames-db:
    image: postgres:17-alpine
    container_name: boardgames-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardgames
      POSTGRES_PASSWORD: ${BOARDGAMES_PROD_DB_PASSWORD:?set BOARDGAMES_PROD_DB_PASSWORD in docker/boardgames/.env}
      POSTGRES_DB: boardgames_prod
      TZ: Europe/Sofia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgames -d boardgames_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /volume1/ServerConfigurations/Boardgames/prod/postgres:/var/lib/postgresql/data
      - /volume1/ServerConfigurations/Boardgames/prod/backups:/backups
