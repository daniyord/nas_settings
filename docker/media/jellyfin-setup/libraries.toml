type = "boxsets"
paths = ["/config/data/data/collections"]
# Made here too: Jellyfin makes it only with the first collection made through the API, so an empty Jellyfin
# wouldn't read the folders, and then with its defaults, which find the collections online (wrong TMDB ids)
create = true
[library.options]
EnableAutomaticSeriesGrouping = true
EnableInternetProviders = false
EnableLUFSScan = false
EnablePhotos = true
EnableRealtimeMonitor = false
LocalMetadataReaderOrder = ["Emby Xml"]
MetadataCountryCode = ""
MetadataSavers = ["Emby Xml"]
PreferredMetadataLanguage = ""
SaveLocalMetadata = true
SkipSubtitlesIfAudioTrackMatches = true
SubtitleDownloadLanguages = []
